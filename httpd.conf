ServerRoot "/usr/local/apache2"
Listen 80
ServerName localhost

# Core modules
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule headers_module modules/mod_headers.so

# Enable debug logging
LogLevel debug proxy:trace8

# Basic configuration
<VirtualHost *:80>
    DocumentRoot "/usr/local/apache2/htdocs"
    
    <Directory "/usr/local/apache2/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
        FallbackResource /index.html
    </Directory>

    # Always revalidate index.html so a new deploy is picked up immediately
    # (the hashed JS/CSS it references are safe to cache forever). This prevents
    # the browser serving a stale index.html that points at the old bundle.
    <FilesMatch "index\.html$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </FilesMatch>

    # Proxy configuration
    ProxyPass /api http://finance-tracker-finance-tracker-be-1:40010/api
    ProxyPassReverse /api http://finance-tracker-finance-tracker-be-1:40010/api
    
    # Add error logging
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
